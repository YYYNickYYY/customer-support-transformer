name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv sync --locked --extra dev --extra tokenizer
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/verify_artifacts.py
